# Explicit fallback: docker compose -f compose.yaml -f compose.direct.yaml up -d --build --wait
services:
  personal-ai-app:
    environment:
      AGENT_RUNTIME_MODE: direct
      NIM_PROFILE: nvidia-hosted-nim
      NIM_ENDPOINT: https://integrate.api.nvidia.com/v1
      NVIDIA_API_KEY_FILE: /run/secrets/nvidia_api_key
    secrets:
      - source: nvidia_api_key
        target: nvidia_api_key
        uid: "10001"
        gid: "10001"
        mode: 0440
secrets:
  nvidia_api_key:
    file: ${NVIDIA_API_KEY_FILE:-./secrets/nvidia_api_key}
