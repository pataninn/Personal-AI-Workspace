name: personal-ai-workspace

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: pai_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - type: volume
        source: pai_pg_data
        target: /var/lib/postgresql/data
    networks:
      - app-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pai_app -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  personal-ai-app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: runtime
    # Keep migration ordering in the two-service MVP1 graph. TypeORM's
    # migration table makes this safe to repeat after an app restart.
    command: ["sh", "-c", "node backend/dist/infrastructure/database/migrate.js && exec node backend/dist/server.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8443
      APP_PROTOCOL: ${APP_PROTOCOL:-https}
      TLS_CERT_FILE: /run/tls/tls.crt
      TLS_KEY_FILE: /run/tls/tls.key
      APP_ORIGIN: ${APP_ORIGIN:-https://127.0.0.1:${APP_PORT:-8443}}
      DATABASE_URL: postgresql://pai_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/personal_ai
      WORKSPACE_HOST_ROOT: ${WORKSPACE_HOST_ROOT:?WORKSPACE_HOST_ROOT must be the verified host workspace path}
      WORKSPACE_ROOT: /workspace
      WORKSPACE_IDENTITY_FILE: ${WORKSPACE_IDENTITY_FILE:-/workspace/.personal-ai-workspace-identity}
      WORKSPACE_IDENTITY: ${WORKSPACE_IDENTITY:?WORKSPACE_IDENTITY must match the preflight marker}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be a long random value}
      DEMO_SESSION_TTL_HOURS: ${DEMO_SESSION_TTL_HOURS:-24}
      DEMO_NETWORK_HASH_SECRET: ${DEMO_NETWORK_HASH_SECRET:-}
      DEMO_GLOBAL_ADMISSION_MAX: ${DEMO_GLOBAL_ADMISSION_MAX:-40}
      DEMO_GLOBAL_ADMISSION_WINDOW_SECONDS: ${DEMO_GLOBAL_ADMISSION_WINDOW_SECONDS:-3600}
      DEMO_NETWORK_ADMISSION_MAX: ${DEMO_NETWORK_ADMISSION_MAX:-5}
      DEMO_NETWORK_ADMISSION_WINDOW_SECONDS: ${DEMO_NETWORK_ADMISSION_WINDOW_SECONDS:-3600}
      DEMO_RUN_START_MAX: ${DEMO_RUN_START_MAX:-10}
      DEMO_RUN_START_WINDOW_SECONDS: ${DEMO_RUN_START_WINDOW_SECONDS:-3600}
      SHOWCASE_MAX_SNAPSHOT_BYTES: ${SHOWCASE_MAX_SNAPSHOT_BYTES:-8388608}
      SHOWCASE_MAX_FILE_BYTES: ${SHOWCASE_MAX_FILE_BYTES:-1048576}
      SHOWCASE_MAX_ITEMS: ${SHOWCASE_MAX_ITEMS:-200}
      SHOWCASE_MAX_FILES: ${SHOWCASE_MAX_FILES:-20}
      SHOWCASE_MAX_RETAINED_VERSIONS: ${SHOWCASE_MAX_RETAINED_VERSIONS:-3}
      DEMO_SHOWCASE_COPY_MAX_ATTEMPTS: ${DEMO_SHOWCASE_COPY_MAX_ATTEMPTS:-3}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      STORAGE_DISK_WARNING_FREE_BYTES: ${STORAGE_DISK_WARNING_FREE_BYTES:-}
      LOCAL_USER_PASSWORD_FILE: /run/secrets/local_user_password
      NIM_PROFILE: ${NIM_PROFILE:-nebius-token-factory}
      NIM_ENDPOINT: ${NIM_ENDPOINT:-https://api.tokenfactory.nebius.com/v1}
      NIM_MODEL: ${NIM_MODEL:?NIM_MODEL must be set in .env}
      NIM_CREDIT_PRICE_VERSION: ${NIM_CREDIT_PRICE_VERSION:-}
      NIM_INPUT_CREDIT_UNITS_PER_MILLION_TOKENS: ${NIM_INPUT_CREDIT_UNITS_PER_MILLION_TOKENS:-}
      NIM_OUTPUT_CREDIT_UNITS_PER_MILLION_TOKENS: ${NIM_OUTPUT_CREDIT_UNITS_PER_MILLION_TOKENS:-}
      NIM_MAX_INPUT_TOKENS: ${NIM_MAX_INPUT_TOKENS:-}
      NIM_MAX_OUTPUT_TOKENS: ${NIM_MAX_OUTPUT_TOKENS:-}
      NIM_MAX_PROVIDER_CALLS_PER_RUN: ${NIM_MAX_PROVIDER_CALLS_PER_RUN:-}
      NIM_ALLOW_ESTIMATED_HOME_USAGE: ${NIM_ALLOW_ESTIMATED_HOME_USAGE:-false}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-hermes}
      HERMES_BRIDGE_ENDPOINT: ${HERMES_BRIDGE_ENDPOINT:-https://host.docker.internal:17871}
      HERMES_BRIDGE_CA_FILE: /run/hermes/ca.crt
      HERMES_BRIDGE_CERT_FILE: /run/hermes/client.crt
      HERMES_BRIDGE_KEY_FILE: /run/hermes/client.key
      RECOVERY_ROOT: /var/lib/personal-ai/recovery
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8443}:8443"
    secrets:
      - source: local_user_password
        target: local_user_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      # This is the sole authoritative workspace mount in the Compose graph.
      - type: bind
        source: ${WORKSPACE_HOST_ROOT:?WORKSPACE_HOST_ROOT must be the verified host workspace path}
        target: /workspace
      - type: volume
        source: pai_recovery
        target: /var/lib/personal-ai/recovery
      - type: bind
        source: ./secrets/hermes-bridge
        target: /run/hermes
        read_only: true
      - type: bind
        source: ${TLS_CERT_DIR:?TLS_CERT_DIR must contain operator-provisioned TLS files}
        target: /run/tls
        read_only: true
    networks:
      - app-data
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "node", "backend/dist/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  app-data:
    internal: true
  # Only the app joins this network. Provider routing remains an application
  # policy decision; PostgreSQL has no path to the public network.
  provider-egress:
    internal: false

volumes:
  pai_pg_data:
    name: ${POSTGRES_VOLUME_NAME:-pai_pg_data}
  pai_recovery:
    name: ${RECOVERY_VOLUME_NAME:-pai_recovery}

secrets:
  local_user_password:
    file: ${LOCAL_USER_PASSWORD_FILE:-./secrets/local_user_password}
